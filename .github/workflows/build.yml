name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Construire la structure Android
        run: |
          mkdir -p proj/app/src/main/java/com/toonmaker/app proj/app/src/main/assets
          cp MainActivity.java proj/app/src/main/java/com/toonmaker/app/
          cp AndroidManifest.xml proj/app/src/main/
          cp index.html proj/app/src/main/assets/
          cat > proj/settings.gradle <<'EOT'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'ToonMaker'
          include ':app'
          EOT
          cat > proj/build.gradle <<'EOT'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOT
          cat > proj/app/build.gradle <<'EOT'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.toonmaker.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.toonmaker.app'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOT
      - name: Compiler
        working-directory: proj
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ToonMaker-APK
          path: proj/app/build/outputs/apk/debug/app-debug.apk
